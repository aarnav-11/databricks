[project]
name = "insurance-fraud-mcp"
version = "0.1.0"
description = "Databricks-hosted MCP tools for the insurance fraud memory POC"
requires-python = ">=3.11"
dependencies = [
  "databricks-sdk>=0.60.0",
  "fastapi>=0.115.12",
  "fastmcp>=2.12.5",
  "uvicorn>=0.34.2",
]

[project.scripts]
insurance-fraud-mcp = "server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
