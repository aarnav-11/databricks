command: ["uv", "run", "start-server"]

env:
  - name: WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: MLFLOW_TRACKING_URI
    value: databricks
  - name: MLFLOW_REGISTRY_URI
    value: databricks-uc
  - name: MODEL_ENDPOINT
    valueFrom: LLM
  - name: MCP_APP_NAME
    valueFrom: ontobricks_kg
  # Set this only if Ontobricks lists multiple domains and cannot identify one
  # unique claims/insurance/fraud domain automatically.
  # - name: MCP_DOMAIN_NAME
  #   value: exact-domain-name-from-list-domains
  - name: CLAIM_TABLE
    valueFrom: claim_360
  - name: PARTY_TABLE
    valueFrom: party_360
  - name: LOCATION_TABLE
    valueFrom: location_360
  - name: POLICY_TABLE
    valueFrom: policy_360
  - name: VECTOR_SEARCH_INDEX
    valueFrom: vector-search-index
  - name: VECTOR_SEARCH_COLUMNS
    value: chunk_id,chunk_to_retrieve,source_path,document_type
  - name: VECTOR_SEARCH_QUERY_COLUMNS
    value: chunk_to_embed
  - name: CLAIM_FRAUD_METRICS_TABLE
    valueFrom: claim_fraud_metrics
