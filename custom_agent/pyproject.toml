[project]
name = "insurance-fraud-supervisor"
version = "0.1.0"
description = "Custom bounded-loop LangGraph supervisor for the insurance fraud POC"
requires-python = ">=3.12,<3.14"
dependencies = [
  "databricks-agents>=1.9.3",
  "databricks-langchain>=0.17.0",
  "databricks-mcp",
  "langchain-core>=0.3.0",
  "langgraph>=1.1.0",
  "mlflow>=3.10.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
start-server = "server.start_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
