# yaml-language-server: $schema=bundle_config_schema.json

bundle:
  name: supervisor_agent_poc

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the POC
    default: workspace
  schema:
    description: Unity Catalog schema for the POC
    default: insurance_fraud_poc
  warehouse_id:
    description: Existing serverless SQL warehouse
    default: 57a8a4c616c87cb2
  model_endpoint:
    description: Databricks foundation model serving endpoint used by the custom agent
    default: databricks-gpt-oss-120b
  mlflow_experiment_id:
    description: MLflow experiment ID used for custom-agent tracing
    default: "3493327909184567"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-d0355882-ae53.cloud.databricks.com
      profile: POC
