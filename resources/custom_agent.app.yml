resources:
  apps:
    supervisor_agent:
      name: insurance-fraud-supervisor-poc
      description: Custom bounded-loop supervisor for the insurance fraud POC.
      source_code_path: ../custom_agent
      config:
        command: ["uv", "run", "start-server"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: databricks
          - name: MLFLOW_REGISTRY_URI
            value: databricks-uc
          - name: MODEL_ENDPOINT
            value_from: LLM
          - name: MCP_APP_NAME
            value_from: ontobricks_kg
          - name: CLAIM_TABLE
            value_from: claim_360
          - name: PARTY_TABLE
            value_from: party_360
          - name: LOCATION_TABLE
            value_from: location_360
          - name: POLICY_TABLE
            value_from: policy_360
          - name: VECTOR_SEARCH_INDEX
            value_from: vector-search-index
          - name: CLAIM_FRAUD_METRICS_TABLE
            value_from: claim_fraud_metrics
      resources:
        - name: ontobricks_kg
          app:
            name: mcp-ontobricks-07x
            permission: CAN_USE
        - name: claim_360
          uc_securable:
            securable_full_name: dmpipeline-dev.ri_gold.claim_360
            securable_type: TABLE
            permission: SELECT
        - name: party_360
          uc_securable:
            securable_full_name: dmpipeline-dev.ri_gold.party_360
            securable_type: TABLE
            permission: SELECT
        - name: location_360
          uc_securable:
            securable_full_name: dmpipeline-dev.ri_gold.location_360
            securable_type: TABLE
            permission: SELECT
        - name: policy_360
          uc_securable:
            securable_full_name: dmpipeline-dev.ri_gold.policy_360
            securable_type: TABLE
            permission: SELECT
        - name: LLM
          serving_endpoint:
            name: databricks-claude-opus-5
            permission: CAN_QUERY
        - name: vector-search-index
          uc_securable:
            securable_full_name: dmpipeline-dev.plane4.chunks_demo_index
            securable_type: TABLE
            permission: SELECT
        - name: claim_fraud_metrics
          uc_securable:
            securable_full_name: dmpipeline-dev.ri_gold.claim_fraud_metrics
            securable_type: TABLE
            permission: SELECT
